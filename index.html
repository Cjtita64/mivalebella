<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amada Vale</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;1,700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758f;
            --bg-dark: #1a1a1a;
            --text-light: #fff0f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #container {
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        /* Pantalla de Inicio */
        #start-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .heart-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: 'Dancing Script', cursive;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
        }

        .heart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.8);
        }

        /* Máquina del Tiempo */
        #time-machine {
            display: none;
        }

        .clock-container {
            font-size: 3rem;
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        .year-display {
            font-size: 5rem;
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }

        /* Mensajes */
        #messages {
            display: none;
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            line-height: 1.5;
            min-height: 200px;
        }

        .message-text {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Revelación de Imagen */
        #image-reveal {
            display: none;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .final-photo {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            border: 5px solid white;
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-top: 20px;
        }

        /* Animaciones */
        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        /* Estrellas de fondo */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #2b0010 0%, #000 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    
    <div id="container">
        <!-- Inicio -->
        <div id="start-screen">
            <h1 style="font-family: 'Dancing Script'; font-size: 3rem; margin-bottom: 20px;">Hola Vale...</h1>
            <p style="margin-bottom: 30px;">Tengo algo especial para ti. ¿Viajamos juntos?</p>
            <button class="heart-btn" onclick="startJourney()">presiona mi niña bonita ❤️</button>
        </div>

        <!-- Máquina del Tiempo -->
        <div id="time-machine">
            <div class="clock-container">
                <div id="clock-icon" style="font-size: 5rem; animation: spin 2s linear infinite;">⏳</div>
                <div class="year-display" id="year-counter">2026</div>
                <p id="travel-status">Iniciando viaje...</p>
            </div>
        </div>

        <!-- Mensajes Románticos -->
        <div id="messages">
            <p id="msg-content" class="message-text"></p>
        </div>

        <!-- Imagen y Final -->
        <div id="image-reveal">
            <h2 style="margin-bottom: 20px; font-family: 'Playfair Display';">Unos años después...</h2>
            <img src="foto.png" alt="Nosotros" class="final-photo">
            <div class="signature">Maykol y Valeria</div>
            <p style="font-style: italic; margin-top: 10px;">Por siempre juntos.</p>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Crear estrellas de fondo
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
            starsContainer.appendChild(star);
        }

        const audio = document.getElementById('bg-music');
        const messages = [
            "Te amo muchoooooooooooo",
            "Eres la mujer de mis sueños",
            "Cada día que pasa es un día menos para ir a verte",
            "La distancia no es para siempre",
            "Te buscaré y nadie nos separará",
            "Los kilómetros no significan nada cuando alguien lo significa todo",
            "a tu lado todo es mejor",
            "nunca me dejes mi niña :c",
            "te amoooooo un chingoooo no lo olvides :3"
        ];

        function startJourney() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('time-machine').style.display = 'block';
            audio.play().catch(e => console.log("Audio play failed, needs user interaction"));
            
            runTimeMachine();
        }

        function runTimeMachine() {
            let year = 2026;
            const yearDisplay = document.getElementById('year-counter');
            const status = document.getElementById('travel-status');
            
            const interval = setInterval(() => {
                year++;
                yearDisplay.innerText = year;
                if (year >= 2028) {
                    clearInterval(interval);
                    status.innerText = "Destino alcanzado...";
                    setTimeout(showMessages, 1500);
                }
            }, 300);
        }

        function showMessages() {
            document.getElementById('time-machine').style.display = 'none';
            const msgDiv = document.getElementById('messages');
            const msgContent = document.getElementById('msg-content');
            msgDiv.style.display = 'flex';
            msgDiv.style.justifyContent = 'center';
            msgDiv.style.alignItems = 'center';

            let index = 0;
            function nextMsg() {
                if (index < messages.length) {
                    msgContent.style.opacity = 0;
                    setTimeout(() => {
                        msgContent.innerText = messages[index];
                        msgContent.style.opacity = 1;
                        index++;
                        setTimeout(nextMsg, 3500);
                    }, 1000);
                } else {
                    setTimeout(revealImage, 1000);
                }
            }
            nextMsg();
        }

        function revealImage() {
            document.getElementById('messages').style.display = 'none';
            const revealDiv = document.getElementById('image-reveal');
            revealDiv.style.display = 'block';
            
            // Efecto de aparición lenta
            setTimeout(() => {
                revealDiv.style.opacity = 1;
            }, 100);
        }
    </script>
</body>
</html>
